{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mb-5 p-4">
            <h1 class="fw-bold mb-3">{{ post.title }}</h1>
            <p class="text-muted border-bottom pb-3 mb-4">
                تاريخ النشر: {{ post.date_posted.strftime('%Y-%m-%d %H:%M') }}
            </p>
            <div class="post-content" style="line-height: 1.8; font-size: 1.1rem;">
                {{ post.content | safe }}
            </div>
        </div>
        <a href="{{ url_for('index') }}" class="btn btn-mono">&rarr; العودة للرئيسية</a>
    </div>
</div>
{% endblock %}
