<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونتي المبسطة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --mono-black: #000000;
            --mono-dark-gray: #333333;
            --mono-gray: #888888;
            --mono-light-gray: #f8f9fa;
            --mono-white: #ffffff;
        }
        body {
            background-color: var(--mono-light-gray);
            color: var(--mono-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Navbar Styling */
        .navbar {
            background-color: var(--mono-black) !important;
            border-bottom: 3px solid var(--mono-gray);
        }
        .navbar-brand, .nav-link {
            color: var(--mono-white) !important;
            letter-spacing: 1px;
        }
        .nav-link:hover {
            color: var(--mono-gray) !important;
        }
        /* Monochrome Buttons */
        .btn-mono {
            background-color: var(--mono-black);
            color: var(--mono-white);
            border: 1px solid var(--mono-black);
            border-radius: 0; /* حواف حادة لتعزيز النمط المبسط */
        }
        .btn-mono:hover {
            background-color: var(--mono-dark-gray);
            color: var(--mono-white);
        }
        .btn-outline-mono {
            background-color: transparent;
            color: var(--mono-black);
            border: 1px solid var(--mono-black);
            border-radius: 0;
        }
        .btn-outline-mono:hover {
            background-color: var(--mono-black);
            color: var(--mono-white);
        }
        /* Cards & Forms */
        .card {
            border: 1px solid var(--mono-gray);
            border-radius: 0;
            background-color: var(--mono-white);
            box-shadow: none;
        }
        .form-control {
            border-radius: 0;
            border: 1px solid var(--mono-gray);
        }
        .form-control:focus {
            border-color: var(--mono-black);
            box-shadow: 0 0 0 0.2rem rgba(0, 0, 0, 0.25);
        }
        /* Tables */
        .table {
            background-color: var(--mono-white);
            color: var(--mono-black);
        }
        .table th {
            background-color: var(--mono-dark-gray);
            color: var(--mono-white);
            border-color: var(--mono-black);
        }
        .table td {
            border-color: var(--mono-gray);
            vertical-align: middle;
        }
        hr {
            border-color: var(--mono-gray);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">MINIMAL BLOG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">لوحة التحكم</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('create') }}">إضافة مقال</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
