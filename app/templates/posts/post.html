{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card mb-5 p-4">
            <h1 class="fw-bold mb-3">{{ post.title }}</h1>
            <div class="text-muted border-bottom pb-3 mb-4 d-flex justify-content-between align-items-center">
                <span>تاريخ النشر: {{ post.date_posted.strftime('%Y-%m-%d %H:%M') }}</span>
                {% if post.category %}
                <a href="{{ url_for('posts.category_posts', category_id=post.category_id) }}" class="text-dark fw-bold text-decoration-none border border-dark px-2 py-1 small transition-hover">
                    {{ post.category.name }}
                </a>
                {% endif %}
            </div>

            {% if post.image_filename %}
            <div class="mb-4">
                <img src="{{ url_for('static', filename='uploads/' + post.image_filename) }}" class="img-fluid border border-dark w-100" alt="{{ post.title }}" style="max-height: 450px; object-fit: cover;">
            </div>
            {% endif %}
            
            <div class="post-content" style="line-height: 1.8; font-size: 1.1rem;">
                {{ post.content | safe }}
            </div>
        </div>
        <a href="{{ url_for('main.index') }}" class="btn btn-mono">&rarr; العودة للرئيسية</a>
    </div>
</div>
{% endblock %}
