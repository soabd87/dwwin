{% extends 'base.html' %} 

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="fw-bold border-bottom pb-2 mb-4">كتابة مقال جديد</h2>
            
            <form action="{{ url_for('admin.create') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">عنوان المقال</label>
                    <input type="text" class="form-control" id="title" name="title" required placeholder="أدخل عنواناً واضحاً...">
                </div>

                <div class="mb-3">
                    <label for="category_id" class="form-label fw-bold">القسم</label>
                    <select class="form-select rounded-0 border-dark" id="category_id" name="category_id" required>
                        <option value="" disabled selected>-- اختر قسماً --</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="image" class="form-label fw-bold">صورة الغلاف (اختياري)</label>
                    <input type="file" class="form-control rounded-0 border-dark" id="image" name="image" accept="image/*">
                </div>
                
                <div class="mb-4">
                    <label for="content" class="form-label fw-bold">محتوى المقال</label>
                    <textarea class="form-control" id="content" name="content" rows="10" required placeholder="اكتب محتوى مقالك هنا..."></textarea>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-mono me-md-2">إلغاء</a>
                    <button type="submit" class="btn btn-mono">نشر المقال</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
