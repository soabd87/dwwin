{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">إعدادات الموقع والحساب</h3>
                <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-dark rounded-0">العودة للوحة التحكم</a>
            </div>

            <div class="card border-dark rounded-0">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin.settings') }}">
                        
                        <h5 class="mb-3 border-bottom border-dark pb-2">إعدادات عامة</h5>
                        <div class="mb-4">
                            <label for="site_name" class="form-label fw-bold">اسم الموقع</label>
                            <input type="text" class="form-control border-dark rounded-0" id="site_name" name="site_name" value="{{ settings.site_name }}" required>
                            <div class="form-text">سيظهر هذا الاسم في أعلى جميع صفحات المدونة.</div>
                        </div>
                        
                        <h5 class="mb-3 border-bottom border-dark pb-2">بيانات الدخول</h5>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">اسم المستخدم (المدير)</label>
                            <input type="text" class="form-control border-dark rounded-0" id="username" name="username" value="{{ current_user.username }}" required>
                        </div>
                        <div class="mb-4">
                            <label for="new_password" class="form-label fw-bold">كلمة المرور الجديدة</label>
                            <input type="password" class="form-control border-dark rounded-0" id="new_password" name="new_password">
                            <div class="form-text text-muted">اترك هذا الحقل فارغاً إذا كنت لا ترغب في تغيير كلمة المرور.</div>
                        </div>

                        <hr class="border-dark">
                        <button type="submit" class="btn btn-dark rounded-0 px-4">حفظ التعديلات</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
