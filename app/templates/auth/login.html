{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-dark rounded-0">
                <div class="card-header bg-dark text-white rounded-0">
                    <h5 class="mb-0 text-center">تسجيل الدخول</h5>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-dark rounded-0 text-center" role="alert">
                                {{ messages[0] }}
                            </div>
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">اسم المستخدم</label>
                            <input type="text" class="form-control border-dark rounded-0" id="username" name="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control border-dark rounded-0" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 rounded-0">دخول</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
